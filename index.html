    <script>
      // Apply the theme before first paint to avoid a flash. Mirrors ThemeProvider: data-theme always
      // holds the theme being shown, the OS setting when nothing is stored (D-128).
      (function () {
        var root = document.documentElement;
        var theme = 'light';
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') theme = t;
          else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {
          theme = 'light';
        }
        root.setAttribute('data-theme', theme);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', theme === 'dark' ? '%THEME_COLOR_DARK%' : '%THEME_COLOR_LIGHT%');
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
