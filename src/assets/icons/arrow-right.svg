<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24">
<!-- Stroke-drawn. The stroke is a fixed screen width (non-scaling) tied to the link underline thickness token plus 0.15px (slightly heavier than the underline, per Jax), whatever the icon size. `fill="none"` stops the CSS `fill` that links set; color comes from currentColor. -->
<path d="M3 12H20.5M13.5 5L20.5 12L13.5 19" fill="none" stroke="currentColor" vector-effect="non-scaling-stroke" style="stroke-width: calc(var(--font-text-decoration-thickness-md, 2px) + 0.15px)" stroke-linecap="round" stroke-linejoin="round" />
</svg>
