name: Delete merged branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    # Only merged PRs from this repo. Closed-unmerged branches stay for review, forks have no branch here.
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          case "$BRANCH" in
            main|redesign|gh-pages) echo "Keeping long-lived branch $BRANCH"; exit 0 ;;
          esac
          # A branch that is the base of another open PR stays until that PR is retargeted or merged.
          stacked=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=$BRANCH" --jq 'length')
          if [ "$stacked" != "0" ]; then echo "Keeping $BRANCH, $stacked open PR(s) target it"; exit 0; fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
          echo "Deleted $BRANCH"
